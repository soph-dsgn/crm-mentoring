name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      KURATORSKAYA_ENVIRONMENT: test
      KURATORSKAYA_DATABASE_URL: sqlite+pysqlite:///./ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run backend tests with coverage
        run: pytest

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify Alembic revision
        run: alembic current

      - name: Check SQLAlchemy metadata against Alembic
        run: alembic check

  backend-postgresql:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KURATORSKAYA_ENVIRONMENT: test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: kuratorskaya_test
          POSTGRES_USER: kuratorskaya
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432
        volumes:
          - /tmp/kuratorskaya-postgres-backups:/backup
        options: >-
          --health-cmd "pg_isready -U kuratorskaya -d kuratorskaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare disposable backup directory
        run: |
          sudo mkdir -p /tmp/kuratorskaya-postgres-backups
          sudo chown "$(id -u):$(id -g)" /tmp/kuratorskaya-postgres-backups
          sudo chmod 0777 /tmp/kuratorskaya-postgres-backups

      - name: Run PostgreSQL integration tests without skips
        env:
          KURATORSKAYA_DATABASE_URL: postgresql+psycopg://kuratorskaya:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/kuratorskaya_test
          KURATORSKAYA_TEST_POSTGRES_URL: postgresql+psycopg://kuratorskaya:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/kuratorskaya_test
          KURATORSKAYA_TEST_POSTGRES_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
          KURATORSKAYA_TEST_POSTGRES_BACKUP_DIR: /tmp/kuratorskaya-postgres-backups
        run: |
          pytest tests/test_postgresql.py --no-cov --junitxml=/tmp/postgresql.xml
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('/tmp/postgresql.xml').getroot(); skipped = sum(int(node.attrib.get('skipped', 0)) for node in root.iter('testsuite')); assert skipped == 0, f'{skipped} PostgreSQL tests were skipped'"

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run existing workflow regression
        run: npm run verify:workflow
