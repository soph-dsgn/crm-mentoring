listen 8443 ssl;
ssl_certificate /etc/nginx/acceptance-tls/localhost.crt;
ssl_certificate_key /etc/nginx/acceptance-tls/localhost.key;
ssl_protocols TLSv1.2 TLSv1.3;

proxy_set_header Host $http_host;
client_max_body_size 11m;

location = /api { return 404; }
location ^~ /api/ { proxy_pass http://backend:8000; }
location = /health/live { proxy_pass http://backend:8000; }
location = /health/ready { proxy_pass http://backend:8000; }
